version: '3'

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list

  build:
    desc: Build frontend assets then compile the Go binary (frontend first so the embedded dist is fresh)
    deps: [frontend:build]
    cmds:
      - task: build:proxy

  frontend:build:
    desc: Build Svelte 5 frontend into backend/internal/dashboard/dist
    cmds:
      - npm --prefix frontend run build

  frontend:dev:
    desc: Run frontend Vite dev server on port 5173 (proxies /admin/* to the local gateway; env passes through)
    cmds:
      - npm --prefix frontend run dev

  frontend:check:
    desc: Run frontend e2e tests (Playwright)
    cmds:
      - npm --prefix frontend run test:e2e

  build:proxy:
    desc: Compile the Go proxy binary
    cmds:
      - go build -o bin/freebucks-proxy{{exeExt}} ./backend/cmd/freebucks-proxy

  test:fast:
    desc: Fast tier — all backend pkgs except pool+server+cmd entrypoints (seconds-scale lane default)
    cmds:
      - env -u AUTH_TOKENS -u ADMIN_TOKEN go test $(go list ./backend/... | grep -v 'backend/internal/pool' | grep -v 'backend/internal/server' | grep -v 'backend/cmd/')

  test:pool:
    desc: Pool tier — backend/internal/pool only (slot/spill/pin ordering)
    cmds:
      - env -u AUTH_TOKENS -u ADMIN_TOKEN go test ./backend/internal/pool/...

  test:server:
    desc: Server tier — backend/internal/server only (known Windows-host flake zone; Linux CI is authority)
    cmds:
      - env -u AUTH_TOKENS -u ADMIN_TOKEN go test ./backend/internal/server/...

  test:e2e:
    desc: Entrypoint tier — backend/cmd/... (E2E harness; hermetic, needs safe.directory in docker)
    cmds:
      - env -u AUTH_TOKENS -u ADMIN_TOKEN go test ./backend/cmd/...

  test:
    desc: Run the hermetic Go test suite (full; CI authority — default behavior unchanged)
    cmds:
      - env -u AUTH_TOKENS -u ADMIN_TOKEN go test ./backend/...

  test:race:
    desc: Run the Go test suite with -race detector (Linux CI owns race; Windows fails cgo exit 2)
    cmds:
      - env -u AUTH_TOKENS -u ADMIN_TOKEN go test -race ./backend/...

  lint:
    desc: Run static analysis and linting (go vet + golangci-lint)
    cmds:
      - go vet ./backend/...
      - golangci-lint run ./backend/...

  dev:
    desc: Run proxy server
    cmds:
      - go run ./backend/cmd/freebucks-proxy

  verify:quick:
    desc: Seconds-scale gate (format + vet + frontend check)
    cmds:
      - test -z "$(gofmt -l backend)"
      - go vet ./backend/...
      - npm --prefix frontend run check

  verify:
    desc: Canonical fast gate (format, vet, build, fast-tier Go tests, frontend checks)
    cmds:
      - test -z "$(gofmt -l backend)"
      - go vet ./backend/...
      - go build ./backend/...
      - task: test:fast
      - npm --prefix frontend run check
      - npm --prefix frontend run lint
      - npm --prefix frontend run format:check

  verify:full:
    desc: Full CI-equivalent gate (verify + race + frontend build/e2e + dist freshness; Windows cgo-exit-2 on race expected, CI owns race)
    cmds:
      - task: verify
      - task: test:race
      - npm --prefix frontend run build
      - npm --prefix frontend run test:e2e
      - git diff --exit-code -- backend/internal/dashboard/dist
