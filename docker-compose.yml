# freebuff-proxy deployment configuration

services:
  freebuff-proxy:
    build:
      context: .
      # Build with host networking: `RUN go mod download` in the Dockerfile
      # times out with a TLS handshake error on hosts whose bridge-network
      # egress is flaky (the documented deployment box needs this too).
      network: host
      # Version stamped into the binary (ldflags -X main.version). The .git
      # dir is excluded from the build context, so it is resolved here on
      # the host: the nearest tag, or the short SHA past it.
      args:
        VERSION: ${VERSION:-dev}
    # Pin/retain a specific build: VERSION=v1.7.0 docker compose up -d --build
    # produces freebuff-proxy:v1.7.0 and rolls back by re-running an older tag.
    image: freebuff-proxy:${VERSION:-latest}
    container_name: freebuff-proxy
    environment:
      # env beats the mounted .env file: guarantees the container listens on
      # the mapped port even when the host .env carries a loopback LISTEN_ADDR.
      - LISTEN_ADDR=:3457
      - ADMIN_FORCE_SECURE_COOKIES=${ADMIN_FORCE_SECURE_COOKIES:-false}
      - ADMIN_INSECURE_HTTP=${ADMIN_INSECURE_HTTP:-}
    # The process cwd IS the mount, so every cwd-relative path the dashboard
    # and config loader touch persists on the host: ./.env (device-login and
    # add/remove-token writes), ./.freebuff-session-state.json (SESSION_PERSIST),
    # ./data/freebuff.db (the SQLite DB, DB_PATH default), and any LOG_FILE
    # under ./logs/. A directory mount — not a single-file bind — is REQUIRED:
    # writeFileAtomic() commits via rename() inside the cwd, and rename over a
    # single-file bind mount fails with EBUSY ("device or resource busy"), which
    # 500s every dashboard save.
    # The directory and its contents must be writable by the container's
    # uid 1000 (the Dockerfile's "app" user, adduser -u 1000):
    #   touch .env && chmod 777 .    (or: chown 1000:1000 .)
    # rename() only needs write on the DIRECTORY, so .env itself can stay 644.
    # The container image is stateless; do NOT set AUTH_TOKENS via compose
    # environment — config precedence (env > .env) would make every
    # dashboard token mutation fail with "overridden by environment".
    working_dir: /app/state
    # This ONE directory bind mount is the whole persistence boundary — do not
    # split it. The SQLite DB at ./data/freebuff.db is not just history: it
    # holds the settings overlay, credentials included (config:AUTH_TOKENS,
    # config:ADMIN_TOKEN, config:API_KEYS, config:WEBHOOK_URL rows), and this
    # bind mount is the shape production runs (no DB_PATH, no second volume).
    # Pointing DB_PATH at a new path or volume is a PARTIALLY SUPPORTED
    # migration, not a free move and not a config tweak:
    #   - display history IS carried: boot copies log_entries, quota_snapshots,
    #     maturity_events and request_records from the legacy file when the
    #     target's history tables are empty (store.ImportLegacyHistoryDB), and
    #     store.LegacyHistoryCandidates lists /app/state/data/freebuff.db as a
    #     source for exactly this move.
    #   - overlay-only operator rows are LOST: nothing carries the settings
    #     overlay from a legacy DB, so knobs the dashboard persisted that do
    #     not exist in the host .env disappear (prod holds 84 config: rows).
    #   - credentials survive only because the same keys exist in the host
    #     .env (AUTH_TOKENS, ADMIN_TOKEN, API_KEYS) and the env -> DB import
    #     re-runs: the config:migrated_env_v1 marker lives in the NEW file, so
    #     a fresh DB always re-imports. A host whose credentials live ONLY as
    #     overlay rows loses them, and the pool degrades to credential-less
    #     bridge mode.
    # Check row counts before and after the move. Never copy a live database
    # with a plain `cp` of the .db/-wal/-shm trio — a copy taken mid-checkpoint
    # reads as an empty sqlite_master. Either `docker compose stop` first and
    # then copy, or snapshot while it runs with sqlite3's
    # Connection.backup() / VACUUM INTO.
    volumes:
      - .:/app/state
    ports:
      # ⚠️ 0.0.0.0 default: /healthz and /metrics are ALWAYS unauthenticated by
      # design (monitoring). Exposing this port beyond localhost publishes them
      # publicly. Bind to loopback on the host instead if that is not wanted:
      #   - "127.0.0.1:3457:3457"
      - "3457:3457"
    restart: unless-stopped
    # Docker's default 10s stop timeout races the app's shutdown: the
    # httpServer.Shutdown gets 10s, then Pool.Shutdown gets its own 20s
    # (main.go) — a 30s worst case. SIGKILL at 20s would abort the pool
    # FINISH drain the grace was added to protect (issue #300).
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3457/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Slow first start (registry refresh at boot) must not mark unhealthy.
      start_period: 10s

  # Turnkey automatic HTTPS reverse proxy via Caddy.
  # Run with: docker compose --profile https up -d
  # Set DOMAIN=proxy.example.com in .env or environment for auto Let's Encrypt TLS.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - https
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - freebuff-proxy

# No volume for the gateway: its state lives in the .:/app/state bind mount
# above. caddy keeps named volumes for its own TLS/ACME data only.
volumes:
  caddy_data:
  caddy_config:
