# freebucks-proxy deployment configuration

services:
  freebucks-proxy:
    build:
      context: .
      # Build with host networking: `RUN go mod download` in the Dockerfile
      # times out with a TLS handshake error on hosts whose bridge-network
      # egress is flaky (the documented deployment box needs this too).
      network: host
      # Version stamped into the binary (ldflags -X main.version). The .git
      # dir is excluded from the build context, so it is resolved here on
      # the host: the nearest tag, or the short SHA past it.
      args:
        VERSION: ${VERSION:-dev}
    # GHCR default pull path, local build override: `docker compose pull` fetches
    # ghcr.io/trefeon/freebucks-proxy; `docker compose build` uses the local context below.
    # `VERSION=x docker compose up -d --build` rebuilds locally from context;
    # `docker compose pull && VERSION=x docker compose up -d` runs GHCR without building.
    image: ghcr.io/trefeon/freebucks-proxy:${VERSION:-latest}
    container_name: freebucks-proxy
    environment:
      # Live store path (update-proof): the db_data volume below mounts at
      # /app/data, so the live DB at /app/data/freebuff.db survives recreates
      # even when the working directory is wrong (a past production outage
      # stranded 20 accounts: cwd=/app resolved the relative default to an
      # /app/data). DB_PATH is the ONLY knob that moves the live store off
      # the bind checkout — an overlay row can never repoint the open file
      # (it resolves from process env before any overlay loads), and .env
      # DB_PATH is unread at open time, so this stays a compose-level
      # setting. Unset DB_PATH only to run bind-direct: working_dir
      # /app/state then resolves the relative default to the bind checkout's
      # ./data/freebuff.db instead of this volume.
      - DB_PATH=/app/data/freebuff.db
      # env beats the mounted .env file: guarantees the container listens on
      # the mapped port even when the host .env carries a loopback LISTEN_ADDR.
      - LISTEN_ADDR=:3457
      - ADMIN_FORCE_SECURE_COOKIES=${ADMIN_FORCE_SECURE_COOKIES:-false}
      - ADMIN_INSECURE_HTTP=${ADMIN_INSECURE_HTTP:-}
    # The process cwd IS the mount, so every cwd-relative path the dashboard
    # and config loader touch persists on the host: ./.env (device-login and
    # add/remove-token writes), ./.freebuff-session-state.json (SESSION_PERSIST),
    # ./data/freebuff.db (the SQLite DB, DB_PATH default), and any LOG_FILE
    # under ./logs/. A directory mount — not a single-file bind — is REQUIRED:
    # writeFileAtomic() commits via rename() inside the cwd, and rename over a
    # single-file bind mount fails with EBUSY ("device or resource busy"), which
    # 500s every dashboard save.
    # The directory and its contents must be writable by the container's
    # uid 1000 (the Dockerfile's "app" user, adduser -u 1000):
    #   touch .env && chmod 777 .    (or: chown 1000:1000 .)
    # rename() only needs write on the DIRECTORY, so .env itself can stay 644.
    # The container image is stateless; do NOT set AUTH_TOKENS via compose
    # environment — config precedence (env > .env) would make every
    # dashboard token mutation fail with "overridden by environment".
    working_dir: /app/state
    # Two-path persistence layout — read this before touching either path:
    #   LIVE STORE  /app/data/freebuff.db on the db_data named volume
    #               (DB_PATH above): the dashboard DB the gateway actually
    #               opens — settings overlay (credentials included:
    #               config:AUTH_TOKENS, config:ADMIN_TOKEN, config:API_KEYS,
    #               config:WEBHOOK_URL rows), pages_state, sessions_persist,
    #               tokens, pool_state, plus display history. Survives
    #               recreates by construction: volumes outlive containers.
    #   BIND STATE  .:/app/state (working_dir): the host checkout — ./.env
    #               (device-login and add/remove-token writes),
    #               ./.freebuff-session-state.json import seed,
    #               ./data/freebuff.db (the pre-volume bind DB, now the
    #               legacy migration source), ./dump/, ./logs/. A directory
    #               mount — not a single-file bind — is REQUIRED:
    #               writeFileAtomic() commits via rename() inside the cwd,
    #               and rename over a single-file bind mount fails with
    #               EBUSY ("device or resource busy"), which 500s every
    #               dashboard save.
    # On first boot with the volume empty, the gateway carries the bind DB
    # forward automatically: display history (store.ImportLegacyHistoryDB)
    # plus the full operator state — settings overlay, pages, sessions,
    # tokens, pool blobs (store.ImportLegacyPersistedState) — from
    # /app/state/data/freebuff.db (store.LegacyHistoryCandidates) into the
    # fresh live store, per-table, idempotent, secrets as opaque DB values.
    # Steady-state boots are strict no-ops (migrate.noop). Legacy files stay
    # in place — never deleted. Snapshot with scripts/backup-state.sh before
    # every recreate; verify with scripts/verify-state.sh after boot.
    # Never copy a live database with a plain `cp` of the .db/-wal/-shm
    # trio — a copy taken mid-checkpoint reads as an empty sqlite_master.
    # Either `docker compose stop` first and then copy, or snapshot while it
    # runs with sqlite3's Connection.backup() / VACUUM INTO.
    volumes:
      - .:/app/state
      - db_data:/app/data
    ports:
      # ⚠️ 0.0.0.0 default: /healthz and /metrics are ALWAYS unauthenticated by
      # design (monitoring). Exposing this port beyond localhost publishes them
      # publicly. Bind to loopback on the host instead if that is not wanted:
      #   - "127.0.0.1:3457:3457"
      - "3457:3457"
    restart: unless-stopped
    # Docker's default 10s stop timeout races the app's shutdown: the
    # httpServer.Shutdown gets 10s, then Pool.Shutdown gets its own 20s
    # (main.go) — a 30s worst case. SIGKILL at 20s would abort the pool
    # FINISH drain the grace was added to protect (issue #300).
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3457/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Slow first start (registry refresh at boot) must not mark unhealthy.
      start_period: 10s

  # Turnkey automatic HTTPS reverse proxy via Caddy.
  # Run with: docker compose --profile https up -d
  # Set DOMAIN=proxy.example.com in .env or environment for auto Let's Encrypt TLS.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - https
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - freebucks-proxy

# Gateway state lives on the db_data named volume (/app/data, the live
# store) plus the .:/app/state bind mount (env, logs, legacy migration
# source). caddy keeps named volumes for its own TLS/ACME data only.
volumes:
  db_data:
  caddy_data:
  caddy_config:
