name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly: Monday 03:00 UTC

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - 'backend/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/codeql.yml'

      - name: Initialize CodeQL
        if: github.event_name != 'pull_request' || steps.filter.outputs.go == 'true'
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: go

      - name: Autobuild
        if: github.event_name != 'pull_request' || steps.filter.outputs.go == 'true'
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4

      - name: Perform CodeQL analysis
        if: github.event_name != 'pull_request' || steps.filter.outputs.go == 'true'
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4