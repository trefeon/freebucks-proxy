name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        if: github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true'
        run: test -z "$(gofmt -l backend)"

      - name: Build
        if: github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true'
        run: go build ./backend/...

      - name: Test (race detector)
        if: github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true'
        env:
          AUTH_TOKENS: ""
          ADMIN_TOKEN: ""
        run: go test -race -timeout 10m ./backend/...

      - name: Verify modules
        if: github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true'
        run: go mod verify

  # Reproduce the embedded dashboard bundle from source and fail when the
  # committed backend/internal/dashboard/dist is stale (the SPA is go:embed'd, so a
  # stale bundle sails silently into the binary).
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'backend/internal/dashboard/dist/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        working-directory: frontend

      - run: npm run check
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        working-directory: frontend

      - run: npm run lint
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        working-directory: frontend

      - run: npm run format:check
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        working-directory: frontend

      - run: npm run build
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        working-directory: frontend

      - name: Cache Playwright browsers
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run SPA e2e suite
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run test:e2e

      - name: Verify committed dashboard bundle is fresh
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        run: git diff --exit-code -- backend/internal/dashboard/dist
