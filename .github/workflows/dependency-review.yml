name: dependency-review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            deps:
              - 'go.mod'
              - 'go.sum'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - '.github/workflows/dependency-review.yml'

      - name: Check dependency review availability
        if: steps.filter.outputs.deps == 'true'
        id: precheck
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE_PATH: repos/${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: |
          status_code=0
          gh api "${COMPARE_PATH}" > response.json || status_code="$?"

          if [ "${status_code}" = "0" ]; then
            echo "supported=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          message="$(jq -r '.message // ""' response.json)"
          if echo "${message}" | grep -qi "dependency graph"; then
            echo "::notice::Skipping dependency review: ${message}"
            echo "supported=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::error::Dependency review precheck failed (exit code ${status_code}): ${message}"
          cat response.json
          exit 1

      - name: Review dependencies
        if: steps.filter.outputs.deps == 'true' && steps.precheck.outputs.supported == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
